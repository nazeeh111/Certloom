[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "certloom"
version = "0.2.0"
description = "Numerical results with portable, exactly checked error bounds"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
certloom = "certloom.cli:main"

[tool.setuptools]
packages = ["certloom"]

[tool.setuptools.package-data]
certloom = ["web/*", "examples/*", "docs/**/*", "docs/*", "licenses/LICENSE"]
